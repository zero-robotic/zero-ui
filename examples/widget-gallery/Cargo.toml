[package]
name = "widget-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["gpu", "cpu"]
cpu = ["zui-app/cpu"]
gpu = ["zui-app/gpu"]

[dependencies]
zui-core.workspace = true
zui-app = { workspace = true, features = ["clipboard"] }
zui-api.workspace = true
zui-types.workspace = true
zui-platform.workspace = true
zui-paint.workspace = true
zui-layout.workspace = true
zui-text = { workspace = true, features = ["system-fonts"] }
zui-theme.workspace = true
zui-widgets.workspace = true

[lints]
workspace = true
