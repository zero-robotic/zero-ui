[package]
name = "zui-window-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["gpu", "cpu"]
cpu = ["zui-app/cpu", "dep:zui-render-cpu"]
gpu = ["zui-app/gpu"]
gpu-bench = ["gpu", "dep:zui-render-gpu", "zui-render-gpu/profiling", "dep:wgpu", "dep:pollster"]

[dependencies]
zui-extras = { workspace = true, features = ["dashboard"] }
zui-render-gpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
zui-render-cpu = { workspace = true, optional = true }
zui-image = { workspace = true, features = ["worker"] }
png.workspace = true
zui-types.workspace = true
zui-paint.workspace = true
zui-platform.workspace = true
zui-app = { workspace = true, features = ["clipboard"] }
zui-api.workspace = true
zui-layout.workspace = true
zui-text.workspace = true
zui-theme.workspace = true
zui-widgets.workspace = true

[lints]
workspace = true

[dev-dependencies]
zui-core.workspace = true

[[example]]
name = "refresh-bench"
required-features = ["cpu"]

[[example]]
name = "gpu-refresh-bench"
required-features = ["gpu-bench"]
