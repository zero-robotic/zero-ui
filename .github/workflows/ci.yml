name: Rust
on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p zui-backend-winit -p zui-app --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --all-targets --all-features --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev fonts-dejavu-core fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: python3 tools/check-dependencies.py
      - run: cargo test -p zui-text --features system-fonts --locked -- --ignored
      - run: cargo test -p zui-render-check --no-default-features --features cpu,system-fonts --test system_fonts --locked -- --ignored
      - run: cargo check -p zui-app --no-default-features --locked
      - run: cargo test -p zui-app --no-default-features --features clipboard --lib clipboard --locked
      - run: cargo check -p zui-app --no-default-features --features clipboard-wayland --locked
      - run: cargo check -p zui-extras --no-default-features --locked
      - run: cargo test -p zui-extras --no-default-features --features charts --locked
      - run: cargo test -p zui-extras --no-default-features --features dashboard --locked
      - run: cargo check -p zui-types -p zui-paint
      - run: cargo check -p zui-render-check --no-default-features --features cpu --locked
      - run: cargo check -p zui-render-check --no-default-features --features gpu --locked
      - run: cargo clippy -p zui-window-check --no-default-features --features cpu --locked -- -D warnings
      - run: cargo clippy -p zui-window-check --no-default-features --features gpu --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

# Real GPU regression is explicit and must run on a GPU-equipped machine:
# cargo test -p zui-render-check --all-features -- --ignored --nocapture
