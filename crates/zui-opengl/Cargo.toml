[package]
name = "zui-opengl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zui-api.workspace = true
zui-types.workspace = true
zui-paint.workspace = true
glow = "=0.17.0"
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
glutin = { version = "=0.32.3", default-features = false, features = ["wgl"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[[test]]
name = "native"
harness = false

[dev-dependencies]
zui-core.workspace = true
zui-layout.workspace = true
zui-text.workspace = true
zui-render-cpu.workspace = true

# Raw GL calls are isolated in this optional desktop adapter.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
